<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paulo Bomfim | Gestão de Frota</title>
<meta name="theme-color" content="#0F1B2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F1B2D;--navy2:#15233A;--navy3:#1E2F4C;--gold:#C9A24A;--gold2:#E6C677;--goldd:#A47C2C;--bg:#F3F5F9;--line:#E5E8EF;--txt:#1B2433;--mut:#6B7488;
--g:#1E9E55;--gbg:#E6F6EC;--o:#DB7414;--obg:#FDF0E1;--b:#2F6FE4;--bbg:#E8F0FD;--r:#D63A3A;--rbg:#FCEAEA;--p:#7A4FD8;--pbg:#F0EAFC;--x:#6B7488;--xbg:#EEF1F5;
--rad:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 3px 12px rgba(16,24,40,.05)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}a{color:inherit}
.ic{flex:none;vertical-align:middle}
.boot{min-height:100vh;display:grid;place-items:center;background:var(--navy);color:#C9D1DF}
/* ---------- logo ---------- */
.logo{display:flex;align-items:center;gap:10px}.logo .mark{width:42px;height:42px;flex:none}.logo img.mark{object-fit:contain}
.logo-txt b{display:block;font-family:Montserrat,Inter,sans-serif;font-weight:800;color:#fff;letter-spacing:.5px;font-size:15px;line-height:1.05}
.logo-txt span{display:block;font-size:7.4px;letter-spacing:2.7px;color:var(--gold);margin-top:4px;font-weight:700}
.logo.lg .mark{width:92px;height:92px}.logo.lg{gap:18px}.logo.lg .logo-txt b{font-size:38px}.logo.lg .logo-txt span{font-size:13px;letter-spacing:8px;margin-top:8px}
.logo.md .mark{width:52px;height:52px}.logo.md .logo-txt b{font-size:20px}.logo.md .logo-txt span{font-size:9px;letter-spacing:3.6px}
/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;background:#fff}
.login .hero{background:radial-gradient(1200px 600px at 0% 0%,#1C2D4A 0,#0F1B2D 55%,#0B1322 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
/* ---------- login: abertura animada da marca (loop 16s) ---------- */
.login .hero:after{content:'';position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(201,162,74,.07);animation:pbOrb 16s ease-in-out infinite alternate}
.login .hero:before{content:'';position:absolute;inset:0;background:radial-gradient(600px 300px at 30% 40%,rgba(201,162,74,.08),transparent 70%);animation:pbHalo 16s ease-in-out infinite}
.pb-streak{position:absolute;left:0;height:1px;width:38%;background:linear-gradient(90deg,transparent,rgba(230,198,119,.55),transparent);opacity:0;pointer-events:none}
.pb-streak.s1{top:24%;animation:pbStreak 11s linear infinite}
.pb-streak.s2{top:71%;width:28%;animation:pbStreak 15s linear 4s infinite}
.pb-streak.s3{top:86%;width:20%;animation:pbStreak 19s linear 9s infinite}
.pb-stage{position:relative;z-index:1;display:flex;flex-direction:column;gap:30px;max-width:600px}
.pb-brand{display:flex;align-items:center;gap:22px}
.pb-mark{width:112px;height:112px;flex:none;overflow:visible;animation:pbMark 16s ease-in-out infinite}
.pb-mark .rd,.pb-mark .bb{stroke-dasharray:1;stroke-dashoffset:1}
.pb-mark .rd{animation:pbRoad 16s ease-in-out infinite}
.pb-mark .bb{animation:pbB 16s ease-in-out infinite}
.pb-mark .ln{opacity:0;animation:pbLane 16s ease-in-out infinite}
.pb-name{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:1px;color:#fff;opacity:0;animation:pbName 16s cubic-bezier(.2,.7,.2,1) infinite}
.pb-sub{font-size:13px;font-weight:700;letter-spacing:8px;color:var(--gold);margin-top:10px;opacity:0;animation:pbSub 16s ease-out infinite}
.pb-rule{height:1px;width:220px;background:linear-gradient(90deg,var(--gold),transparent);transform-origin:left;transform:scaleX(0);animation:pbRule 16s ease-in-out infinite}
.login .tag{letter-spacing:7px;font-size:12px;color:#C9D1DF;opacity:0;animation:pbTag 16s ease-out infinite}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;max-width:560px}
.feat{display:flex;gap:12px;align-items:center;font-size:12.5px;letter-spacing:1.2px;font-weight:600;color:#E7ECF4;opacity:0}.feat .ic{color:var(--gold)}
.feat:nth-child(1){animation:pbF1 16s ease-out infinite}.feat:nth-child(2){animation:pbF2 16s ease-out infinite}
.feat:nth-child(3){animation:pbF3 16s ease-out infinite}.feat:nth-child(4){animation:pbF4 16s ease-out infinite}
@keyframes pbRoad{0%,3%{stroke-dashoffset:1;opacity:1}20%,89%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes pbB{0%,14%{stroke-dashoffset:1;opacity:1}34%,89%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes pbLane{0%,18%{opacity:0}25%,89%{opacity:1}97%,100%{opacity:0}}
@keyframes pbMark{0%,33%{filter:drop-shadow(0 0 0 rgba(230,198,119,0));transform:scale(1)}38%{filter:drop-shadow(0 0 14px rgba(230,198,119,.55));transform:scale(1.03)}46%,89%{filter:drop-shadow(0 0 5px rgba(230,198,119,.25));transform:scale(1)}97%,100%{filter:none;transform:scale(.96)}}
@keyframes pbName{0%,36%{opacity:0;transform:translateY(14px);letter-spacing:6px}45%,89%{opacity:1;transform:none;letter-spacing:1px}96%,100%{opacity:0;transform:translateY(-6px);letter-spacing:1px}}
@keyframes pbSub{0%,42%{opacity:0;transform:translateY(8px)}50%,89%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes pbRule{0%,46%{transform:scaleX(0)}55%,89%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
@keyframes pbTag{0%,52%{opacity:0;transform:translateY(8px)}59%,89%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes pbF1{0%,60%{opacity:0;transform:translateY(10px)}66%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes pbF2{0%,64%{opacity:0;transform:translateY(10px)}70%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes pbF3{0%,68%{opacity:0;transform:translateY(10px)}74%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes pbF4{0%,72%{opacity:0;transform:translateY(10px)}78%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
@keyframes pbOrb{0%{transform:scale(1) rotate(0)}100%{transform:scale(1.12) rotate(18deg)}}
@keyframes pbHalo{0%,30%{opacity:0}45%,85%{opacity:1}100%{opacity:0}}
@keyframes pbStreak{0%{transform:translateX(-100%);opacity:0}10%{opacity:1}60%{opacity:.6}75%,100%{transform:translateX(300%);opacity:0}}
@media (prefers-reduced-motion:reduce){.login .hero *,.login .hero:before,.login .hero:after{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.pb-streak{display:none}}
.login .form{display:flex;align-items:center;justify-content:center;padding:32px}
.lbox{width:100%;max-width:380px}.lbox h2{margin:0 0 6px;font-size:26px}.lbox p{margin:0 0 24px;color:var(--mut)}
.lbox .f{margin-bottom:14px}.lbox .btn{width:100%;justify-content:center;padding:14px}
.lerr{background:var(--rbg);color:var(--r);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.lmob{display:none}
/* ---------- layout admin ---------- */
.layout{display:flex;min-height:100vh}
.side{width:236px;background:linear-gradient(180deg,#0E1828,#101D31);color:#C9D1DF;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:60;transition:transform .25s}
.side .brand{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.nav{flex:1;overflow:auto;padding:14px 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#C9D1DF;text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer;user-select:none}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:linear-gradient(90deg,#CDA650,#A9802F);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(201,162,74,.28)}
.nav .badge{margin-left:auto;background:var(--r);color:#fff;border-radius:10px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;font-weight:700}
.side .me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:10px;align-items:center}
.side .me b{display:block;color:#fff;font-size:13px}.side .me small{color:#8C97AB;font-size:11px}
.side .out{display:flex;align-items:center;gap:12px;padding:12px 24px 18px;color:#C9D1DF;cursor:pointer;font-size:13.5px}
.side-bk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2F6FE4,#1E4FB0);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none;font-size:13px}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.lg{width:76px;height:76px;font-size:24px}
.main{flex:1;margin-left:236px;min-width:0}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:40}
.topbar .grow{flex:1}.hamb{display:none!important}
.bell{position:relative;background:none;border:0;color:var(--txt);padding:8px;border-radius:10px}.bell:hover{background:var(--bg)}
.bell .dot{position:absolute;top:2px;right:0;background:var(--r);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;border:2px solid #fff}
.uchip{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;cursor:pointer;position:relative}.uchip:hover{background:var(--bg)}
.uchip b{display:block;font-size:13px}.uchip small{color:var(--mut);font-size:11px}
.umenu{position:absolute;right:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);min-width:200px;padding:6px;display:none}
.umenu.open{display:block}.umenu a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;font-size:13px}.umenu a:hover{background:var(--bg)}
.content{padding:24px 26px 48px;max-width:1520px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.2px}.page-h p{margin:4px 0 0;color:var(--mut)}
.page-h .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}.card-h h3{margin:0;font-size:15px;font-weight:700;flex:1;display:flex;align-items:center;gap:9px}
.card-h h3 .ic{color:var(--gold)}
.card-b{padding:10px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpi{padding:16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:transform .12s}.kpi:hover{transform:translateY(-2px)}
.kpi .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .v{font-size:24px;font-weight:800;line-height:1.1}.kpi .l{color:var(--txt);font-size:13px;margin:3px 0 8px}
.dash3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;margin-top:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{border:1px solid #D9DEE7;border-radius:10px;padding:9px 12px;background:#fff;min-height:40px;outline:none}
.toolbar .srch{position:relative;flex:1;min-width:220px;max-width:380px}.toolbar .srch input{width:100%;padding-left:36px}.toolbar .srch .ic{position:absolute;left:11px;top:11px;color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs a{padding:10px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:13.5px}.tabs a.on{color:var(--txt);border-color:var(--gold)}
/* pills / botões */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:3px 10px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill.g{background:var(--gbg);color:var(--g)}.pill.o{background:var(--obg);color:var(--o)}.pill.b{background:var(--bbg);color:var(--b)}.pill.r{background:var(--rbg);color:var(--r)}.pill.p{background:var(--pbg);color:var(--p)}.pill.x{background:var(--xbg);color:var(--x)}
.pill.blk{display:flex;width:100%;padding:6px;border-radius:7px;margin-top:auto}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--txt);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#CBD2DE}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#D3AE58,#B88D36);border-color:#B88D36;color:#fff}.btn.pri:hover{filter:brightness(1.04)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.red{color:var(--r);border-color:#F2C2C2}.btn.grn{color:var(--g);border-color:#BFE6CF}
.btn.ghost{background:transparent;border-color:transparent}.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.link{border:1px solid #C9D7F4;color:var(--b);background:#fff;padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.icon{padding:7px}
/* tabelas */
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;color:var(--mut);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFD}
.tbl td{padding:10px;border-bottom:1px solid #F0F2F6;font-size:12.8px;vertical-align:middle}
.tbl tr.ck td{cursor:pointer}.tbl tr:hover td{background:#FAFBFD}.tbl .r{text-align:right}.tbl b{font-weight:600}
.tbl.compact td{padding:8px 8px;font-size:12px}.tbl.compact th{padding:8px}
.muted{color:var(--mut)}.small{font-size:12px}.nowrap{white-space:nowrap}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}.empty .ic{color:#B7C0CE;margin-bottom:8px}.empty b{display:block;color:var(--txt);margin-bottom:4px}
/* veículos */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.vgrid.big{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.vcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;position:relative;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
.vcard:hover{box-shadow:0 6px 20px rgba(16,24,40,.08)}
.vcard .ph{height:100px;border-radius:9px;background:linear-gradient(180deg,#F6F8FB,#EAEFF6);display:grid;place-items:center;overflow:hidden;color:#9AA6B9;margin-bottom:10px}
.vgrid.big .vcard .ph{height:140px}
.vcard .ph img{width:100%;height:100%;object-fit:cover}
.noph{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.vcard .dots{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border:0;border-radius:6px;width:24px;height:24px;color:var(--mut);font-size:16px;line-height:1}
.plate{display:inline-block;background:#E6EEFB;color:var(--navy);font-weight:800;font-size:12px;padding:3px 7px;border-radius:5px;letter-spacing:.6px;align-self:flex-start}
.vm{font-weight:600;font-size:13px;margin-top:7px}.vy{color:var(--mut);font-size:12px}
.vd{display:flex;align-items:center;gap:5px;font-size:12px;color:#3A4558;margin-top:7px}.vk{font-weight:700;font-size:13.5px;margin:6px 0 10px}
/* listas alertas */
.al{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #F0F2F6;align-items:flex-start;cursor:pointer}.al:last-child{border:0}
.al .ai{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.al b{display:block;font-size:12.8px;font-weight:600}.al small{color:var(--mut);font-size:11.5px}.al .t{margin-left:auto;color:var(--mut);font-size:11px;white-space:nowrap}
/* donut */
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.leg{flex:1;min-width:140px}
.leg div{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;color:#3A4558}.leg i{width:9px;height:9px;border-radius:50%;flex:none}.leg span{margin-left:auto;font-weight:600}
/* formulários */
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px}
.fg.g3{grid-template-columns:repeat(3,1fr)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}.f.s2{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:#3A4558}.f label i{color:var(--r);font-style:normal}
.f input,.f select,.f textarea{border:1px solid #D9DEE7;border-radius:10px;padding:10px 12px;background:#fff;outline:none;min-height:42px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.16)}
.f input:disabled,.f select:disabled{background:#F5F7FA;color:var(--mut)}
.hint{color:var(--mut);font-size:11.5px}
.sec-t{grid-column:1/-1;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--goldd);text-transform:uppercase;margin-top:6px;border-top:1px dashed var(--line);padding-top:12px}
.sec-t:first-child{border:0;padding-top:0;margin-top:0}
.ferr{background:var(--rbg);color:var(--r);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px}
.note{display:flex;gap:8px;align-items:center;background:var(--bbg);color:#284C8F;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:14px 0 0}
.tot{font-size:20px;font-weight:800;padding:8px 0}
/* uploads */
.ups{display:flex;flex-wrap:wrap;gap:8px}
.up{width:78px;height:78px;border-radius:10px;overflow:hidden;position:relative;background:#EEF1F6;display:grid;place-items:center;border:1px solid var(--line);cursor:pointer}
.up img{width:100%;height:100%;object-fit:cover}
.up .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(15,27,45,.75);color:#fff;border:0;display:grid;place-items:center;padding:0}
.up.add{border:1.5px dashed #C3CBD8;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;gap:3px;background:#FAFBFD}
.up .pdf{font-weight:800;color:var(--r);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.up.loading:after{content:'';width:24px;height:24px;border:3px solid #D5DBE5;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg2{display:inline-flex;background:#EEF1F6;border-radius:10px;padding:3px;gap:3px;margin-bottom:8px;align-self:flex-start}
.seg2 button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--mut)}.seg2 button.on{background:#fff;color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* itens de manutenção */
.mi{display:grid;grid-template-columns:1fr 1.4fr .8fr .9fr .7fr auto;gap:10px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#FBFCFE;position:relative}
.mi .mi-calc{grid-column:1/-1;font-size:12px;color:#284C8F;background:var(--bbg);border-radius:8px;padding:7px 10px}
.mi .mi-calc:empty{display:none}
/* modal */
.mback{position:fixed;inset:0;background:rgba(10,16,28,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:94vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:1000px}

async function api(action, data = {}) {
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL)) throw new Error('Configure a API_URL no index.html (URL /exec do Apps Script).');
  let r;
  try { r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, data, v: CONFIG.APP_VERSION }) }); }
  catch (e) { throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('Resposta inválida do servidor.'); }
  if (!j.ok) {
    if (j.code === 'AUTH') { logoutLocal(j.error); throw new Error(j.error); }
    if (j.code === 'PWD') { formSenhaPropria(true); }
    throw new Error(j.error || 'Erro inesperado.');
  }
  return j;
}

function compressImage(file, max = 1600, q = .82) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { let w = img.naturalWidth, h = img.naturalHeight; const r = Math.min(1, max / Math.max(w, h)); w = Math.round(w * r); h = Math.round(h * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('falha')), 'image/jpeg', q); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem')); };
    img.src = url;
  });
}
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
function b64ToBlob(b64, mime) { const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
async function uploadFile(file, categoria, entidade = '', entidadeId = '') {
  let blob = file, mime = (file.type || '').toLowerCase(), name = file.name || 'arquivo';
  if (!mime && /\.pdf$/i.test(name)) mime = 'application/pdf';
  if (mime.startsWith('image/')) { try { blob = await compressImage(file); mime = 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg'; } catch (e) {} }
  if (blob.size > 10 * 1048576) throw new Error('Arquivo maior que 10 MB.');
  const r = await api('upload', { base64: await toB64(blob), mime, name, categoria, entidade, entidadeId });
  S.data.anexos = S.data.anexos || []; S.data.anexos.push(r.anexo); S.A[r.anexo.ID] = r.anexo;
  if (!r.anexo.URL && mime.startsWith('image/')) S.imgCache[r.anexo.ID] = URL.createObjectURL(blob);
  return r.anexo;
}
async function anexoUrl(id) {
  if (S.imgCache[id]) return S.imgCache[id];
  const a = S.A[id]; if (a && a.URL) return a.URL;
  const r = await api('getFile', { id });
  return (S.imgCache[id] = URL.createObjectURL(b64ToBlob(r.base64, r.mime)));
}
function imgFor(id) {
  const a = S.A[id]; if (!a) return '';
  if (a.MIME === 'application/pdf') return `<div class="pdfbig">${ic('file', 26)}PDF</div>`;
  if (S.imgCache[id]) return `<img src="${S.imgCache[id]}" alt="">`;
  if (a.URL) return `<img src="${esc(a.URL)}" loading="lazy" referrerpolicy="no-referrer" alt="">`;
  return `<img data-anx="${esc(id)}" alt="">`;
}
function hydrate(root = document) { $$('img[data-anx]', root).forEach(async img => { const id = img.dataset.anx; img.removeAttribute('data-anx'); try { img.src = await anexoUrl(id); } catch (e) {} }); }
async function openAnexo(id) {
  const a = S.A[id]; if (!a) return toast('Arquivo não encontrado.', 'err');
  const isPdf = a.MIME === 'application/pdf';
  const m = openModal({ title: esc(CAT_LBL[a.CATEGORIA] || 'Arquivo') + ` <small class="muted" style="font-weight:400">· ${dBR(a.ENVIADO_EM)}</small>`, wide: true, body: `<div class="viewer"><div class="spin"></div></div>` });

function upInit(key, cat, max, opt = {}) { S.up[key] = { ids: (opt.ids || []).slice(), max, cat, pending: 0, accept: opt.accept || 'image/*', capture: !!opt.capture }; }
function upField(key, label, hint = '') { return `<div class="f s2"><label>${label}</label><div class="ups" id="up-${key}">${upThumbs(key)}</div>${hint ? `<small class="hint">${hint}</small>` : ''}</div>`; }
function upThumbs(key) {
  const u = S.up[key]; if (!u) return '';
  let h = u.ids.map(id => `<div class="up" onclick="openAnexo('${id}')">${imgFor(id)}<button type="button" class="rm" onclick="event.stopPropagation();upRm('${key}','${id}')">${ic('x', 13)}</button></div>`).join('');
  for (let i = 0; i < u.pending; i++) h += '<div class="up loading"></div>';
  if (u.ids.length + u.pending < u.max) h += `<label class="up add">${ic(u.accept.includes('pdf') ? 'clip' : 'camera', 20)}<span>${u.ids.length ? 'Adicionar mais' : 'Adicionar'}</span><input type="file" hidden accept="${u.accept}" ${u.capture ? 'capture="environment"' : ''} ${u.max - u.ids.length > 1 ? 'multiple' : ''} onchange="upPick('${key}',this)"></label>`;
  return h;
}
function upRedraw(key) { const el = $('#up-' + key); if (el) { el.innerHTML = upThumbs(key); hydrate(el); } }
async function upPick(key, inp) {
  const u = S.up[key]; const files = [...inp.files].slice(0, Math.max(0, u.max - u.ids.length - u.pending)); inp.value = '';
  if (!files.length) return;
  u.pending += files.length; S.busyUp++; upRedraw(key);
  for (const f of files) { try { const a = await uploadFile(f, u.cat); u.ids.push(a.ID); } catch (e) { toast(e.message, 'err'); } u.pending--; upRedraw(key); }
  S.busyUp--;
  if (S.flow) renderFlow();
}
function upRm(key, id) { const u = S.up[key]; u.ids = u.ids.filter(x => x !== id); upRedraw(key); if (S.flow) renderFlow(); }

}
function closeAllModals() { $('#modals').innerHTML = ''; }
function renderFields(fields, v = {}) {
  return fields.map(f => {
    if (f.t === 'sec') return `<div class="sec-t">${f.l}</div>`;
    if (f.t === 'html') return `<div class="f s2">${f.html}</div>`;
    const val = v[f.k] ?? f.def ?? '';
    let inp;
    if (f.t === 'select') inp = `<select name="${f.k}" ${f.dis ? 'disabled' : ''} ${f.on ? `onchange="${f.on}"` : ''}>${(f.o || []).map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
    else if (f.t === 'textarea') inp = `<textarea name="${f.k}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
    else inp = `<input name="${f.k}" type="${f.t || 'text'}" value="${esc(val)}" placeholder="${esc(f.ph || '')}" ${f.step ? `step="${f.step}"` : ''} ${f.t === 'number' ? 'inputmode="decimal"' : ''} ${f.dis ? 'disabled' : ''} ${f.on ? `oninput="${f.on}"` : ''} autocomplete="${f.auto || 'off'}">`;
    return `<div class="f ${f.s2 ? 's2' : ''}"><label>${f.l}${f.req ? ' <i>*</i>' : ''}</label>${inp}${f.help ? `<small class="hint">${f.help}</small>` : ''}</div>`;
  }).join('');
}
function readFields(fields, root) {
  const o = {};
  fields.forEach(f => {
    if (!f.k || f.t === 'sec' || f.t === 'html') return;
    const el = root.querySelector(`[name="${f.k}"]`); if (!el) return;
    let v = String(el.value).trim();
    if (f.req && v === '') throw new Error('Preencha o campo "' + f.l.replace(/<[^>]+>/g, '') + '".');
    if (f.up) v = v.toUpperCase();
    o[f.k] = f.t === 'number' ? (v === '' ? '' : toNum(v)) : v;
  });
  return o;
}
function formModal({ title, fields, values = {}, saveLabel = 'Salvar', wide = false, top = '', bottom = '', onSave }) {
  const m = openModal({ title, wide, body: `${top}<div class="fg">${renderFields(fields, values)}</div>${bottom}<div class="ferr" hidden></div>`,
    foot: `<button class="btn" data-c>Cancelar</button><button class="btn pri" data-s>${ic('check', 16)} ${saveLabel}</button>` });
  m.querySelector('[data-c]').onclick = () => m.remove();
  const btn = m.querySelector('[data-s]'), err = m.querySelector('.ferr');
  btn.onclick = async () => {
    err.hidden = true;
    try {

      await onSave(vals, m);
      m.remove();
    } catch (e) { err.textContent = e.message; err.hidden = false; err.scrollIntoView({ block: 'nearest' }); }

function csv(name, cols, rows) {
  const line = a => a.map(v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';');
  const txt = '\ufeff' + [line(cols.map(c => c[1]))].concat(rows.map(r => line(cols.map(c => typeof c[0] === 'function' ? c[0](r) : r[c[0]])))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = name + '.csv'; a.click();

function isBusy() { return !!(S.flow || $('#modals .mback') || S.busyUp > 0); }
async function checkVersion() {
  try {
    const r = await fetch(CONFIG.VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!j.version || j.version === CONFIG.APP_VERSION) return;
    if (sessionStorage.getItem('pb_reload_' + j.version)) return; // evita loop se o index ainda estiver em cache
    if (isBusy()) { $('#upd').innerHTML = `<div class="upd">${ic('refresh', 16)} Nova versão disponível <button class="btn sm pri" onclick="doUpdate('${esc(j.version)}')">Atualizar</button></div>`; return; }
    doUpdate(j.version);
  } catch (e) {}
}
function doUpdate(v) { sessionStorage.setItem('pb_reload_' + v, '1'); location.replace(location.pathname + '?v=' + encodeURIComponent(v)); }
function startTimers() {
  setInterval(checkVersion, 60000);
  setInterval(() => { if (!document.hidden && !isBusy() && S.user && S.user.TROCAR_SENHA !== 'S') loadData().then(() => render(true)).catch(() => {}); }, CONFIG.REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkVersion(); if (S.user && !isBusy()) loadData().then(() => render(true)).catch(() => {}); } });
}

async function upEnt(ent, id, cat, campo, inp) {

  loading(true, 'Enviando ' + files.length + ' arquivo(s)…');
  try {
    let first = null;
    for (const f of files) { const a = await uploadFile(f, cat, ent, id); first = first || a; }
    const rec = ent === 'VEICULO' ? S.V[id] : S.M[id];
    if (campo && (campo !== 'FOTO_ID' || !rec.FOTO_ID)) await api('setArquivo', { entidade: ent, id, campo, anexoId: first.ID });

function formDoc() {
  const dest = [['', '— selecione —']].concat(D().veiculos.map(v => ['VEICULO:' + v.ID, 'Veículo · ' + v.MODELO + ' ' + v.PLACA]), D().motoristas.map(m => ['MOTORISTA:' + m.ID, 'Motorista · ' + m.NOME]));

    { k: 'cat', l: 'Tipo de documento', t: 'select', o: [['CRLV', 'CRLV (veículo)'], ['DOC_VEICULO', 'Outro documento do veículo (seguro, laudo…)'], ['CNH', 'CNH (motorista)'], ['DOC_MOTORISTA', 'Outro documento do motorista']], s2: 1 },

/* ------------------- FLUXO: CHECKLIST + KM (saída/retorno) ------------------ */
function startFlow(tipo) {
  const ab = dAberta(), v = tipo === 'retorno' ? (ab && S.V[ab.VEICULO_ID]) || dVeic() : dVeic();
  if (!v) return;
  if (tipo === 'retorno' && !ab) return toast('Nenhuma jornada aberta.', 'err');
  if (tipo === 'saida' && ab) return startFlow('retorno');
  S.flow = { tipo, step: 1, veiculoId: v.ID, jornadaId: ab ? ab.ID : '', resp: {}, obs: {}, km: '', comb: '', observacoes: '', reqId: uid(), sending: false };
  upInit('odo', 'ODOMETRO', 1, { capture: true }); upInit('chkf', 'CHECKLIST', 4);
  render(); window.scrollTo(0, 0);
}
function flowItens() { return String((D().config || {}).CHECKLIST_ITENS || '').split('|').map(s => s.trim()).filter(Boolean); }
function renderFlow() {
  const F = S.flow, v = S.V[F.veiculoId], ab = dAberta(), saida = F.tipo === 'saida';
  const itens = flowItens(); const st = F.step;
  const kmIni = ab ? toNum(ab.KM_INICIAL) : 0;
  const seg = (it, val, cls, lbl) => `<button class="${F.resp[it] === val ? 'on ' + cls : ''}" onclick="S.flow.resp['${jsq(it)}']='${val}';renderFlow()">${lbl}</button>`;
  let body = '', foot = '';
  if (st === 1) {
    body = `<div class="fsec"><span>Itens obrigatórios</span><a href="javascript:void 0" style="color:var(--g)" onclick="flowItens().forEach(i=>S.flow.resp[i]='OK');renderFlow()">Marcar tudo OK</a></div>
     ${itens.map(it => `<div class="chk-row"><div class="ln1"><span class="n">${esc(it)}</span><div class="seg">${seg(it, 'OK', 'ok', 'OK')}${seg(it, 'Atenção', 'at', 'Atenção')}${seg(it, 'Não conforme', 'nc', 'NC')}</div></div>
      ${F.resp[it] && F.resp[it] !== 'OK' ? `<input placeholder="O que foi observado?" value="${esc(F.obs[it] || '')}" oninput="S.flow.obs['${jsq(it)}']=this.value">` : ''}</div>`).join('')}
     <div class="fbody"><div class="f" style="margin-top:12px"><label>Foto do odômetro (obrigatório)</label><div class="ups" id="up-odo">${upThumbs('odo')}</div><small class="hint">Tire a foto mostrando o painel com o KM legível.</small></div>
      <div class="f" style="margin-top:14px"><label>${saida ? 'KM inicial' : 'KM final'} <i>*</i></label><input class="kmbig" type="number" inputmode="numeric" value="${esc(F.km)}" placeholder="${saida ? nf.format(toNum(v.KM_ATUAL)) : nf.format(kmIni)}" oninput="S.flow.km=this.value;const e=document.getElementById('kmr');if(e)e.textContent=flowKmTxt()">
      <small class="hint" id="kmr">${flowKmTxt()}</small></div></div>`;
    foot = `<button class="bigbtn" onclick="flowNext()">Continuar ${ic('arrow', 18)}</button>`;
  } else if (st === 2) {
    const needObs = Object.values(F.resp).some(r => r !== 'OK');
    body = `<div class="fbody"><div class="f"><label>Nível de combustível</label><div class="chips">${['Reserva', '1/4', '1/2', '3/4', 'Cheio'].map(c => `<button class="${F.comb === c ? 'on' : ''}" onclick="S.flow.comb='${c}';renderFlow()">${c}</button>`).join('')}</div></div>
      <div class="f" style="margin-top:16px"><label>Fotos do veículo (opcional, até 4)</label><div class="ups" id="up-chkf">${upThumbs('chkf')}</div><small class="hint">Registre avarias, pneus ou qualquer detalhe que queira documentar.</small></div>
      <div class="f" style="margin-top:16px"><label>Observações ${needObs ? '<i>*</i>' : ''}</label><textarea rows="3" oninput="S.flow.observacoes=this.value" placeholder="${needObs ? 'Explique os itens marcados como Atenção / NC' : 'Opcional'}">${esc(F.observacoes)}</textarea></div></div>`;
    foot = `<button class="bigbtn" onclick="flowNext()">Continuar ${ic('arrow', 18)}</button>`;
  } else {
    const nc = itens.filter(i => F.resp[i] === 'Não conforme').length, at = itens.filter(i => F.resp[i] === 'Atenção').length;
    body = `<div class="fbody"><div class="sumbox"><div class="row"><span>Veículo</span><b>${esc(v.MODELO + ' · ' + v.PLACA)}</b></div>
      ${saida ? `<div class="row"><span>KM inicial</span><b>${km(F.km)}</b></div>` : `<div class="row"><span>KM inicial</span><b>${km(kmIni)}</b></div><div class="row"><span>KM final</span><b>${km(F.km)}</b></div><div class="row"><span>KM rodados</span><b>${km(toNum(F.km) - kmIni)}</b></div>`}
      <div class="row"><span>Combustível</span><b>${esc(F.comb)}</b></div><div class="row"><span>Checklist</span><b>${itens.length - nc - at} OK${at ? ' · ' + at + ' atenção' : ''}${nc ? ' · ' + nc + ' NC' : ''}</b></div>
      <div class="row"><span>Fotos</span><b>${S.up.odo.ids.length} odômetro · ${S.up.chkf.ids.length} veículo</b></div></div>
      ${nc ? `<div class="warn red" style="margin:10px 0">${ic('alert', 18)}<div>Itens não conformes geram uma ocorrência automática e o Paulo é avisado por e-mail.</div></div>` : ''}
      <p class="muted small">Ao confirmar, o registro é enviado ao servidor. ${saida ? 'Lembre-se: ao voltar, encerre a jornada com o KM final e a foto do odômetro.' : ''}</p></div>`;
    foot = `<button class="bigbtn ${saida ? '' : 'dark'}" ${F.sending ? 'disabled' : ''} onclick="flowSend()">${F.sending ? 'Enviando…' : saida ? ic('play', 18) + ' Confirmar e iniciar jornada' : ic('check', 18) + ' Confirmar e encerrar jornada'}</button>`;
  }
  $('#app').innerHTML = `<div class="flow"><div class="flow-h"><button class="btn ghost icon" onclick="flowBack()">${ic('left', 22)}</button><h3>${saida ? 'Checklist de saída' : 'Checklist de retorno'}</h3>${ic('car', 20)}</div>
   <div class="stepper">${[1, 2, 3].map(n => `<div class="st ${n === st ? 'on' : n < st ? 'done' : ''}">${n < st ? ic('check', 14) : n}</div>${n < 3 ? `<div class="ln ${n < st ? 'done' : ''}"></div>` : ''}`).join('')}</div>
   <div class="steplbl"><span>Itens e KM</span><span>Fotos</span><span>Confirmar</span></div>${body}<div class="flow-f">${foot}</div></div>`;
  hydrate($('#app'));
}
function flowKmTxt() {
  const F = S.flow, v = S.V[F.veiculoId], ab = dAberta(), k = toNum(F.km);
  if (F.tipo === 'saida') return 'Último KM registrado: ' + km(v.KM_ATUAL) + (k && k < toNum(v.KM_ATUAL) ? ' — o KM não pode ser menor!' : '');
  const ini = ab ? toNum(ab.KM_INICIAL) : 0; if (!k) return 'KM inicial desta jornada: ' + km(ini);
  return k < ini ? 'O KM final não pode ser menor que o inicial (' + km(ini) + ')!' : 'KM rodados nesta jornada: ' + km(k - ini);
}
function flowNext() {
  const F = S.flow, itens = flowItens(), v = S.V[F.veiculoId], ab = dAberta();
  try {
    if (S.busyUp > 0) throw new Error('Aguarde o envio das fotos.');
    if (F.step === 1) {
      const falt = itens.filter(i => !F.resp[i]); if (falt.length) throw new Error('Responda todos os itens do checklist (' + falt[0] + ').');
      if (!S.up.odo.ids.length) throw new Error('Tire a foto do odômetro.');
      const k = toNum(F.km); if (!k) throw new Error('Informe o KM do odômetro.');
      if (F.tipo === 'saida' && k < toNum(v.KM_ATUAL)) throw new Error('O KM não pode ser menor que o último registrado (' + km(v.KM_ATUAL) + ').');
      if (F.tipo === 'retorno' && ab && k < toNum(ab.KM_INICIAL)) throw new Error('O KM final não pode ser menor que o inicial (' + km(ab.KM_INICIAL) + ').');
    }
    if (F.step === 2) {
      if (!F.comb) throw new Error('Selecione o nível de combustível.');
      if (Object.values(F.resp).some(r => r !== 'OK') && !F.observacoes.trim()) throw new Error('Descreva nas observações os itens com Atenção / NC.');
    }
    F.step++; renderFlow(); window.scrollTo(0, 0);
  } catch (e) { toast(e.message, 'err'); }
}
async function flowBack() {
  if (S.flow.step > 1) { S.flow.step--; return renderFlow(); }
  if (await confirmBox('Sair do checklist? O que foi preenchido será descartado.', 'Sair', true)) { S.flow = null; render(); }
}
async function flowSend() {
  const F = S.flow; if (F.sending) return; F.sending = true; renderFlow();
  const respostas = flowItens().map(i => ({ item: i, resposta: F.resp[i], obs: F.obs[i] || '' }));
  const payload = { veiculoId: F.veiculoId, jornadaId: F.jornadaId, km: toNum(F.km), fotoKmId: S.up.odo.ids[0], combustivel: F.comb, respostas, fotosIds: S.up.chkf.ids, observacoes: F.observacoes, reqId: F.reqId };
  try {
    const r = await api(F.tipo === 'saida' ? 'startJornada' : 'endJornada', payload);
    toast(F.tipo === 'saida' ? 'Jornada iniciada. Boa viagem!' : 'Jornada encerrada · ' + km(r.kmRodados) + ' rodados');
    if (r.ocorrencia) toast('Ocorrência registrada para os itens não conformes.');
    S.flow = null; S.dtab = 'inicio'; await reload(); window.scrollTo(0, 0);
  } catch (e) { F.sending = false; renderFlow(); toast(e.message, 'err'); }
}

/* ============================== INÍCIO =============================== */
document.addEventListener('click', e => { if (!e.target.closest('.uchip')) $$('.umenu.open').forEach(m => m.classList.remove('open')); });
boot();
</script>
